group 'com.stockfish'
version '1.0'

// The published package still declares AGP 3.5 and jcenter(), both removed by
// current Flutter/Gradle projects. The app already provides a modern Android
// Gradle Plugin, so the library only needs to apply it here.
apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

