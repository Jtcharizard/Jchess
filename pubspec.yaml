name: jchess
description: Xadrez offline, personalizável e educativo para Android.
publish_to: none
version: 0.4.1+5

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  chess: ^0.8.1
  flutter_svg: ^2.0.17
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  stockfish: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wallpapers/
    - assets/branding/
    - assets/bots/
    - assets/pieces/chessnut/
    - assets/pieces/fantasy/
    - assets/pieces/spatial/
    - assets/pieces/celtic/
    - assets/pieces/rhosgfx/
    - assets/pieces/kiwen-suwi/
    - assets/pieces/papercut/
    - assets/pieces/pixel/
    - assets/pieces/shapes/
    - assets/pieces/totoy/
    - assets/pieces/neon/
    - assets/pieces/shahi-ivory-brown/
    - assets/pieces/pirouetti/
    - assets/pieces/letter/
    - assets/pieces/firi/

flutter_launcher_icons:
  android: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#181411"
  adaptive_icon_foreground: assets/branding/app_icon.png
